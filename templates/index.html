<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação de Switch Cisco - Mercado Livre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        legend {
            font-weight: bold;
            color: #555;
            padding: 0 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2b3a4a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1a252f;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }
        .alert-success { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }
        .alert-danger { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }
        pre {
            background-color: #fff;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Painel de Configuração de Rede</h2>
        
        {% if message %}
            <div class="alert {% if success %}alert-success{% else %}alert-danger{% endif %}">
                <strong>{{ message }}</strong>
                {% if output %}
                    <pre>{{ output }}</pre>
                {% endif %}
            </div>
        {% endif %}

        <form method="POST">
            <fieldset>
                <legend>Dados de Conexão</legend>
                <label>IP do Switch:</label>
                <input type="text" name="host" value="{{ values.get('host', '') }}" placeholder="Ex: 192.168.1.10" required>
                
                <label>Usuário:</label>
                <input type="text" name="username" value="{{ values.get('username', '') }}" required>
                
                <label>Senha:</label>
                <input type="password" name="password" required>
                
                <label>Novo Hostname:</label>
                <input type="text" name="hostname" value="{{ values.get('hostname', 'SWITCH_AUTOMATIZADO') }}" required>
            </fieldset>
            
            <fieldset>
                <legend>Parâmetros de VLAN</legend>
                <label>ID VLAN Dados (VLAN_DADOS):</label>
                <input type="number" name="vlan_dados" value="{{ values.get('vlan_dados', '10') }}" min="1" max="4094" required>
                
                <label>ID VLAN Voz (VLAN_VOZ):</label>
                <input type="number" name="vlan_voz" value="{{ values.get('vlan_voz', '20') }}" min="1" max="4094" required>
                
                <label>ID VLAN Segurança (VLAN_SEGURANCA):</label>
                <input type="number" name="vlan_seguranca" value="{{ values.get('vlan_seguranca', '50') }}" min="1" max="4094" required>
            </fieldset>
            
            <button type="submit">Aplicar Configuração e Salvar</button>
        </form>
    </div>
</body>
</html>
